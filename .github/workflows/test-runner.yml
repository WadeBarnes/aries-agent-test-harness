name: test-harness-runner
# ====================================================================================
# Top level test flow control
# ------------------------------------------------------------------------------------
# Created as a solution for:
#   - https://github.com/hyperledger/aries-agent-test-harness/issues/457
#
# This workflow will dynamically pick up and run any workflow starting with 
# 'test-harness-'.
#
# Specific test harnesses can be excluded by adding their file name pattern to the 
# 'ignore_files_starts_with' list separated by a ','.
#
# The test harnesses are run by the Run Test Harness job which uses a throttled matrix
# strategy.  The number of concurrent test harness runs can be controlled by setting
# the 'max-parallel' parameter to an appropriate number.
#
# ------------------------------------------------------------------------------------
# Workflow Dispatch Actions
# ------------------------------------------------------------------------------------
# There were several Workflow Dispatch Actions reviewed during the
# investigation, I did not keep track of all of them only the two that provided the 
# desired features and appeared to be worth testing out.
#
# aurelien-baudet/workflow-dispatch@v2.1.1
#   - https://github.com/aurelien-baudet/workflow-dispatch
#   - This one worked but I had issues with it hanging and locking up the main
#     workflow when dispatched workflows did not complete normally.
#   - It also did not provide good feedback as to its progress.
#   - Fewer inputs that need to be configured
#   - Was only able to trigger workflows when they were contained on the default
#     branch, even though git ref could be provided.
#
# convictional/trigger-workflow-and-wait@v1.6.0
#   - https://github.com/convictional/trigger-workflow-and-wait
#   - Requires more inputs to be configured.
#   - Provides better feedback about progress and is more responsive.
#   - Unable to find pure workflow_dispatch workflows on a git ref; expected.
#   - When canceling the workflow an in-progress step will wait until the end
#     of wait_interval before it is canceled.
# ====================================================================================
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  # ToDo:
  #   - Remove push trigger when done testing.
  push:
jobs:
  get-test-harnesses:
    name: Get Test Harnesses
    runs-on: ubuntu-latest
    if: (github.event_name == 'schedule' && github.repository == 'hyperledger/aries-agent-test-harness') || (github.event_name != 'schedule')
    outputs:
      harnesses: ${{ steps.get-file-list.outputs.files }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v2

      - name: Get File List
        id: get-file-list
        uses: the-coding-turtle/ga-file-list@v0.4.1
        with:
          directory: ".github/workflows"
          file_extension: "yml"

          # ==============================================
          # Include all test harnesses by default.
          # ==============================================
          only_files_starts_with: "test-harness-"

          # ==============================================
          # Ignore specific test harnesses here
          # ----------------------------------------------
          # - verity:
          #   - Ignored due to issues with the tests being 
          #     canceled intermitently due to (seemingly) 
          #     resource issues.
          # ==============================================
          ignore_files_starts_with: "test-harness-verity-"

  run-test-harness:
    name: Run Test Harness
    needs: [get-test-harnesses]
    runs-on: ubuntu-latest
    if: (github.event_name == 'schedule' && github.repository == 'hyperledger/aries-agent-test-harness') || (github.event_name != 'schedule')
    strategy:
      max-parallel: 7
      matrix:
        test-workflow: ${{ fromJson(needs.get-test-harnesses.outputs.harnesses) }}
      fail-fast: false
    steps:
      - name: ${{ matrix.test-workflow }}
        if: success() || failure()
        uses: convictional/trigger-workflow-and-wait@v1.6.0
        with:
          workflow_file_name: ${{ matrix.test-workflow }}
          owner: ${{ github.event.repository.owner.name }}
          repo: ${{ github.event.repository.name }}
          ref: ${{ github.event.ref }}
          github_token: ${{ secrets.REPO_ACCESS_TOKEN }}
          wait_workflow: true
          wait_interval: 60

  generate-summary-results:
    name: Generate Summary Results
    needs: [run-test-harness]
    if: (success() || failure()) && ((github.event_name == 'schedule' && github.repository == 'hyperledger/aries-agent-test-harness') || (github.event_name != 'schedule'))
    runs-on: ubuntu-latest
    steps:
      - name: generate-summary-results.yml
        uses: convictional/trigger-workflow-and-wait@v1.6.0
        with:
          workflow_file_name: generate-summary-results.yml
          owner: ${{ github.event.repository.owner.name }}
          repo: ${{ github.event.repository.name }}
          ref: ${{ github.event.ref }}
          github_token: ${{ secrets.REPO_ACCESS_TOKEN }}
          wait_workflow: true
          wait_interval: 60